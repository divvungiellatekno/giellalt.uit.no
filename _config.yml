title: Language Technology at UiT
description: The Divvun and Giellatekno teams build language technology aimed at minority and indigenous languages
url: "https://divvungiellatekno.github.io"
baseurl: "/giellalt.uit.no"
theme: jekyll-theme-giellalt

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    disable: true

repository: divvungiellatekno/giellalt.uit.no
source_dir: ""

# Exclude problematic files from Jekyll processing
exclude:
  - "docs-prebuild.sh"
  - "docs-postbuild.sh"
  - "package.json"
  - "package-lock.json"
  - "node_modules/"
  - "vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - ".git/"
  - ".github/"
  - ".gitignore"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - ".bundle/"

# Keep raw Slidev files accessible
keep_files:
  - "*-slidev"
