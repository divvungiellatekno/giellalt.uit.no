remote_theme: giellalt/jekyll-theme-giellalt@main

title: Language Technology at UiT
repository: divvungiellatekno/giellalt.uit.no

description: The Divvun and Giellatekno teams build language technology aimed at minority and indigenous languages

plugins:
  - jekyll-default-layout
  - jekyll-gist
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jemoji

# HTML compression settings
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]
  blanklines: false
  profile: false
  startings: [html, head, body]

# SASS/SCSS compression
sass:
  style: compressed

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    disable: true

# GitHub Pages kompatibilitet
repository: divvungiellatekno/giellalt.uit.no
baseurl: /giellalt.uit.no

# Exclude problematic files from Jekyll processing
exclude:
  - "package.json"
  - "package-lock.json"
  - "node_modules/"
  - "vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - ".git/"
  - ".github/"
  - ".gitignore"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - ".bundle/"

# Keep raw Slidev files accessible
keep_files:
  - "*-slidev"
